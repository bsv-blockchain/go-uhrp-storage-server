# ------------------------------------------------------------------------------------
#  Build and Push Docker Image
#
#  Purpose: Build the server image from the root Dockerfile and publish it to the
#  GitHub Container Registry (GHCR).
#
#  Triggers:
#    - Pull requests to main: build only (verifies the Dockerfile, nothing is pushed)
#    - Pushes to main: publish ghcr.io/<repo>:latest and :<commit-sha>
#    - Release tags (v*): publish ghcr.io/<repo>:<tag> and :<commit-sha>
#    - Manual dispatch: publish :latest (or :<tag> when run from a tag) and :<commit-sha>
# ------------------------------------------------------------------------------------

name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Security: Restrict default permissions (jobs must explicitly request what they need)
permissions: {}

# Cancel superseded runs for the same branch or PR; tag and main pushes always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Required to push the image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          if [[ "$REF_TYPE" == "tag" ]]; then
            deployment_tag="$REF_NAME"
          else
            deployment_tag="latest"
          fi
          echo "Deployment tag: $deployment_tag"
          {
            echo "tags<<EOF"
            echo "${image}:${SHA}"
            echo "${image}:${deployment_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
