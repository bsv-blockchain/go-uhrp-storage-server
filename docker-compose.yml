services:
  uhrp-storage-server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
    volumes:
      # Uploaded files are written to public/cdn; keep them across container restarts
      - storage-data:/app/public/cdn
    restart: unless-stopped

volumes:
  storage-data:
